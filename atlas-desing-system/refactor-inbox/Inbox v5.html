<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas — Inbox v5 · ultra premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
:root {
  /* ═══ Color depth · 4 variações de bege (técnica #10) ═══ */
  --bg:           #F4EFE6;  /* body default */
  --bg-recessed:  #EFE8DA;  /* afundado (search, dock backdrop) */
  --bg-raised:    #F8F2E9;  /* elevado (card on hover) */
  --bg-deep:      #E8E0CC;  /* mais afundado (premium recess) */
  --surface:      #EAE3D6;
  --premium:      #E0D8C9;

  /* Ink */
  --ink:          #1A1612;
  --ink2:         #6B6358;
  --ink3:         #A89F90;
  --ink-warm-shadow: rgba(26,22,18,0.08);

  /* Borders */
  --border:       #D4CCBC;
  --border-soft:  #DCD3C0;

  /* Bronze · foil gradient stops */
  --bronze:       #9B7A3F;
  --bronze-deep:  #7A5E2F;
  --bronze-light: #C9A663;
  --bronze-pale:  #D4B57A;

  /* Accents */
  --prussian:     #1B3A57;
  --rec-red:      #8B2635;       /* canonical DS */
  --rec-red-oxide: #A8312A;      /* tinta-sangue oxidado · só recording */
  --moss:         #4A5D3A;

  /* Domains */
  --dom-blackink: #1B3A57;
  --dom-atlas:    #5D4A8A;
  --dom-saude:    #4A5D3A;
  --dom-financas: #9B7A3F;
  --dom-outro:    #6B6358;

  /* Typography */
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:  'Inter', -apple-system, sans-serif;
  --mono:  'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

  /* ═══ Motion tokens (consolidado dos 5 agentes) ═══ */
  --ease-editorial:  cubic-bezier(0.22, 1, 0.36, 1);    /* default tween */
  --ease-ceremonial: cubic-bezier(0.16, 1, 0.3, 1);     /* page load, sheets */
  --ease-iOS-smooth: cubic-bezier(0.32, 0.72, 0, 1);    /* layout shifts */
  --ease-exit:       cubic-bezier(0.4, 0, 1, 1);        /* dismiss */
  --ease-hermes:     cubic-bezier(0.45, 0, 0.55, 1);    /* breathing sin-like */

  --dur-instinct:    180ms;
  --dur-considered:  320ms;
  --dur-ceremonial:  480ms;
  --dur-sacred:      620ms;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: #15110d;
  font-family: var(--sans);
  font-feature-settings: 'kern' 1, 'liga' 1;
  color: rgba(244,239,230,0.85);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ═══ Ambient breathing keyframes (sin-like, never linear) ═══ */
@keyframes atlas-mark-breath {
  0%, 100% { box-shadow: 0 4px 14px rgba(27,58,87,0.32), 0 0 0 0 rgba(155,122,63,0.0); }
  50%      { box-shadow: 0 4px 18px rgba(27,58,87,0.36), 0 0 0 3px rgba(155,122,63,0.08); }
}
@keyframes sync-bar-breath-a {
  0%, 100% { opacity: 0.08; }
  50%      { opacity: 0.22; }
}
@keyframes cartog-drift {
  0%, 100% { transform: translate(0, 0); opacity: 0.048; }
  50%      { transform: translate(1.2px, 0.8px); opacity: 0.062; }
}
@keyframes bullet-breath {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}
@keyframes status-fade {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 0.42; }
}
@keyframes foil-shimmer {
  0%, 100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}
@keyframes record-pulse-oxide {
  0%, 100% { box-shadow: 0 8px 28px rgba(26,22,18,0.32), 0 0 0 0 rgba(168,49,42,0.4); }
  50%      { box-shadow: 0 8px 28px rgba(26,22,18,0.32), 0 0 0 9px rgba(168,49,42,0.0); }
}
@keyframes hairline-bronze-canon {
  /* defasado 180ms do record-pulse para criar canon visual Hermès lockstitch */
  0%, 100% { border-top-color: rgba(155,122,63,0.18); }
  50%      { border-top-color: rgba(155,122,63,0.42); }
}
@keyframes dot-rec-breath {
  /* 1400ms ciclo, lento como respiração de monge */
  0%, 100% { opacity: 0.62; transform: scale(1); }
  50%      { opacity: 1.0;  transform: scale(1.04); }
}
@keyframes counter-tick {
  0%, 100% { transform: translateY(0); }
  10%      { transform: translateY(-0.7px); }
  20%      { transform: translateY(0); }
}
@keyframes wave-1 { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
@keyframes wave-2 { 0%,100% { transform: scaleY(0.7); } 50% { transform: scaleY(0.3); } }
@keyframes wave-3 { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(0.9); } }
@keyframes wave-4 { 0%,100% { transform: scaleY(0.9); } 50% { transform: scaleY(0.45); } }
@keyframes wave-5 { 0%,100% { transform: scaleY(0.3); } 50% { transform: scaleY(0.85); } }
@keyframes wave-6 { 0%,100% { transform: scaleY(0.6); } 50% { transform: scaleY(0.25); } }
@keyframes wave-7 { 0%,100% { transform: scaleY(0.45); } 50% { transform: scaleY(0.95); } }
@keyframes new-card-glow {
  0%, 100% { box-shadow: inset 3px 0 0 rgba(155,122,63,0.0); }
  50%      { box-shadow: inset 3px 0 0 rgba(155,122,63,0.55); }
}
@keyframes save-sweep {
  0%   { transform: translateX(-100%); opacity: 0; }
  20%  { opacity: 0.42; }
  100% { transform: translateX(100%); opacity: 0; }
}

/* ═══ Microinterações refinadas ═══ */
.atlas-card {
  transition: transform 320ms var(--ease-editorial),
              background 320ms var(--ease-editorial),
              box-shadow 320ms var(--ease-editorial);
  cursor: pointer;
  border-radius: 4px;
  position: relative;
}
.atlas-card:hover {
  transform: translateY(-1px) translateZ(0);
  background: var(--bg-raised);
  box-shadow:
    0 1px 0 rgba(155,122,63,0.06),
    0 6px 24px rgba(26,22,18,0.05);
}
.atlas-card:active {
  transform: translateY(0) translateZ(0);
  background: var(--bg-deep);
}
.atlas-action {
  transition: color 220ms var(--ease-editorial), transform 220ms var(--ease-editorial);
  cursor: pointer;
}
.atlas-action:hover { color: var(--ink) !important; }
.atlas-action.danger:hover {
  color: var(--rec-red) !important;
  opacity: 1 !important;
}
.atlas-action:active { transform: scale(0.96); }
.atlas-chip {
  transition: color 280ms var(--ease-editorial), border-color 280ms var(--ease-editorial);
  cursor: pointer;
}
.atlas-chip:not(.active):hover {
  color: var(--ink2) !important;
  border-color: rgba(212, 204, 188, 0.5) !important;
}
.atlas-pill {
  transition: transform 200ms var(--ease-editorial);
}
.atlas-pill:active { transform: scale(0.97); }
.atlas-mode-tab {
  transition: color 280ms var(--ease-editorial);
  cursor: pointer;
}
.atlas-mode-tab:not(.active):hover .label { color: var(--ink2) !important; }
.atlas-mode-tab:not(.active):hover .subtitle { color: var(--ink2) !important; }
.atlas-link {
  transition: color 220ms var(--ease-editorial);
  cursor: pointer;
}
.atlas-link:hover { color: var(--ink2) !important; }
.atlas-search-pill {
  transition: border-color 320ms var(--ease-editorial), box-shadow 320ms var(--ease-editorial);
}
.atlas-search-pill:focus-within {
  border-color: rgba(155,122,63,0.4) !important;
  box-shadow: 0 0 0 3px rgba(155,122,63,0.06);
}

/* ═══ Foil bronze metálico (técnica #5) ═══ */
.foil-bronze {
  background: linear-gradient(135deg,
    var(--bronze-light) 0%,
    var(--bronze) 25%,
    var(--bronze-deep) 50%,
    var(--bronze) 75%,
    var(--bronze-light) 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: foil-shimmer 5s var(--ease-hermes) infinite;
  filter: drop-shadow(0 0.5px 0 rgba(122,94,47,0.4));
  display: inline-block;
}

/* ═══ Letterpress headline (técnica #4) ═══ */
.letterpress {
  text-shadow:
    0 1px 0 rgba(255,250,240,0.55),
    0 -0.5px 0 rgba(26,22,18,0.06);
}

/* ═══ Edge lighting bronze hairline (técnica #2) ═══ */
.edge-lit-top {
  border-top: 0.5px solid rgba(155,122,63,0.25);
}

/* ═══ Specular highlight (técnica #8) ═══ */
.specular-highlight {
  position: relative;
}
.specular-highlight::before {
  content: '';
  position: absolute;
  top: 5px; left: 8px;
  width: 18px; height: 8px;
  background: radial-gradient(ellipse, rgba(244,239,230,0.32) 0%, transparent 70%);
  border-radius: 50%;
  filter: blur(2px);
  pointer-events: none;
  z-index: 1;
}

/* ═══ Stage layout ═══ */
.stage {
  min-height: 100vh;
  padding: 56px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 56px;
  align-items: center;
}
.phone-row {
  display: flex; flex-wrap: wrap;
  gap: 32px; justify-content: center; align-items: flex-start;
}
.frame-col { display: flex; flex-direction: column; align-items: center; }
.frame-cap {
  font-family: var(--serif);
  font-style: italic;
  font-variation-settings: 'opsz' 18;
  color: rgba(244,239,230,0.5);
  font-size: 12.5px;
  margin: 0 0 14px;
  text-align: center;
  max-width: 320px;
  letter-spacing: 0.005em;
}

.notes {
  max-width: 1080px;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.65;
  color: rgba(244,239,230,0.72);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px 40px;
}
.notes h2 {
  font-family: var(--serif);
  font-variation-settings: 'opsz' 144;
  font-size: 32px; font-weight: 400;
  letter-spacing: -0.025em;
  color: #F4EFE6;
  margin: 0 0 4px;
  grid-column: 1 / -1;
}
.notes .lede {
  font-family: var(--serif);
  font-style: italic;
  font-variation-settings: 'opsz' 24;
  font-size: 15px; line-height: 1.55;
  color: rgba(244,239,230,0.92);
  margin: 8px 0 18px;
  border-left: 1px solid rgba(155,122,63,0.5);
  padding-left: 14px;
  grid-column: 1 / -1;
}
.notes section { display: block; }
.notes h3 {
  font-family: var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 10px;
  color: rgba(244,239,230,0.5);
  margin: 0 0 10px;
  font-weight: 500;
}
.notes p { margin: 0 0 10px; }
.notes em {
  font-family: var(--serif); font-style: italic;
  font-variation-settings: 'opsz' 18;
  color: rgba(244,239,230,0.95);
}
.notes ul { margin: 0; padding: 0; list-style: none; }
.notes li {
  padding: 6px 0;
  border-bottom: 1px solid rgba(244,239,230,0.06);
  display: flex; gap: 12px;
}
.notes li:last-child { border-bottom: none; }
.notes li .num {
  font-family: var(--mono);
  color: rgba(244,239,230,0.4);
  font-size: 11px;
  flex-shrink: 0;
  padding-top: 1px;
  min-width: 18px;
}
.notes .br { color: #C9A663; font-family: var(--serif); font-style: italic; }
.notes .new { color: #C9A663; font-weight: 600; font-size: 9.5px; letter-spacing: 0.1em; }
.notes .span2 { grid-column: span 2; }
.notes .span3 { grid-column: 1 / -1; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ════════════════════════════════════════════════════════
//  IosFrame canonical
// ════════════════════════════════════════════════════════
const iosFrameStyles = {
  wrapper: {
    display: 'inline-block', padding: 12, background: '#000',
    borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 28px 80px rgba(26,22,18,0.5)',
    position: 'relative',
  },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#F4EFE6' },
  statusBar: {
    position: 'absolute', top: 0, left: 0, right: 0, height: 54,
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    padding: '0 32px', fontSize: 16, fontWeight: 600,
    fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20, pointerEvents: 'none',
  },
  dynamicIsland: {
    position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
    width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30,
  },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: {
    width: 26, height: 12, border: '1.5px solid currentColor',
    borderRadius: 3, padding: 1, position: 'relative', opacity: 0.85,
  },
  batteryCap: {

    background: 'currentColor', borderRadius: '0 1px 1px 0',
  },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'hidden' },
  homeIndicator: {
    position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)',
    width: 140, height: 5, background: 'rgba(0,0,0,0.3)', borderRadius: 999, zIndex: 10,
  },
};
function IosFrame({ children, time = '13:13', battery = 78 }) {
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width: 393, height: 852 }}>
        <div style={{ ...iosFrameStyles.statusBar, color: '#1A1612' }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: '#1A1612' }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  Vellum 3-layer (técnica #6) · grain + felt + flecks
// ════════════════════════════════════════════════════════
function VellumGrain({ id }) {
  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.06, mixBlendMode: 'multiply', zIndex: 0 }} width="100%" height="100%">
      <filter id={id}>
        <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" stitchTiles="stitch" seed="3" />
        <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.85 0" />
      </filter>
      <rect width="100%" height="100%" filter={`url(#${id})`} />
    </svg>
  );
}
function VellumFelt({ id }) {
  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.025, mixBlendMode: 'multiply', zIndex: 0 }} width="100%" height="100%">
      <filter id={id}>
        <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="3" stitchTiles="stitch" seed="7" />
        <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0.7 0" />
      </filter>
      <rect width="100%" height="100%" filter={`url(#${id})`} />
    </svg>
  );
}
function VellumFlecks({ seed = 1 }) {
  // pequenas manchas microscópicas pseudo-aleatórias
  const positions = [
    {x: 23, y: 87, r: 0.5}, {x: 145, y: 124, r: 0.4}, {x: 287, y: 56, r: 0.6},
    {x: 78, y: 234, r: 0.3}, {x: 312, y: 189, r: 0.5}, {x: 56, y: 412, r: 0.4},
    {x: 234, y: 367, r: 0.5}, {x: 178, y: 478, r: 0.3}, {x: 345, y: 523, r: 0.4},
    {x: 89, y: 612, r: 0.5}, {x: 267, y: 689, r: 0.3}, {x: 134, y: 745, r: 0.4},
    {x: 198, y: 92, r: 0.4}, {x: 45, y: 312, r: 0.5}, {x: 367, y: 445, r: 0.3},
  ];
  return (
    <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.13, zIndex: 0, mixBlendMode: 'multiply' }} width="100%" height="100%" viewBox="0 0 393 800" preserveAspectRatio="xMidYMid slice">
      {positions.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r={p.r} fill="rgba(122,94,47,0.6)" />
      ))}
    </svg>
  );
}

// ════════════════════════════════════════════════════════
//  Vinheta direcional (técnica #7) · luz top-left
// ════════════════════════════════════════════════════════
function PaperVignetteDirectional() {
  return (
    <div style={{
      position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 0,
      background: `
        radial-gradient(ellipse 80% 60% at 22% 18%, rgba(255,250,240,0.07), transparent 55%),
        radial-gradient(ellipse 100% 80% at 82% 88%, rgba(122,94,47,0.08), transparent 50%)
      `,
    }} />
  );
}

// ════════════════════════════════════════════════════════
//  Cartog · drift 22s ambient
// ════════════════════════════════════════════════════════
function Cartog() {
  return (
    <svg
      width="100%" height="100%" viewBox="0 0 393 800"
      preserveAspectRatio="xMidYMid slice"
      style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        color: '#1A1612', zIndex: 0,
        animation: 'cartog-drift 22s var(--ease-hermes) infinite',
      }}
    >
      <path d="M 60 -20 Q 90 200 60 420 Q 30 640 60 860" stroke="currentColor" strokeWidth="0.5" fill="none" />
      <path d="M 333 -20 Q 303 200 333 420 Q 363 640 333 860" stroke="currentColor" strokeWidth="0.5" fill="none" />
      <path d="M 196 -20 Q 196 400 196 860" stroke="currentColor" strokeWidth="0.4" fill="none" opacity="0.6" />
      <path d="M -20 180 Q 196 200 410 180" stroke="currentColor" strokeWidth="0.4" fill="none" />
      <path d="M -20 460 Q 196 480 410 460" stroke="currentColor" strokeWidth="0.4" fill="none" />
      <path d="M -20 700 Q 196 720 410 700" stroke="currentColor" strokeWidth="0.4" fill="none" />
      <g transform="translate(345 30)" opacity="0.5">
        <circle r="11" fill="none" stroke="currentColor" strokeWidth="0.5" />
        <circle r="7"  fill="none" stroke="currentColor" strokeWidth="0.4" opacity="0.7" />
        <path d="M 0 -11 L 0 11 M -11 0 L 11 0" stroke="currentColor" strokeWidth="0.5" />
      </g>
      <circle cx="120" cy="320" r="0.8" fill="currentColor" opacity="0.7" />
      <circle cx="270" cy="240" r="0.8" fill="currentColor" opacity="0.7" />
      <circle cx="80"  cy="540" r="0.8" fill="currentColor" opacity="0.7" />
      <circle cx="290" cy="600" r="0.8" fill="currentColor" opacity="0.7" />
    </svg>
  );
}

// ════════════════════════════════════════════════════════
//  LiveStatus · crossfade 11s
// ════════════════════════════════════════════════════════
const liveStatusStyles = {
  wrap: {
    position: 'absolute', top: -4, left: 0, right: 0,
    display: 'flex', justifyContent: 'center',
    pointerEvents: 'none', zIndex: 4,
  },
  pill: {
    display: 'inline-flex', alignItems: 'center', gap: 8,
    padding: '4px 14px',
    fontFamily: 'var(--serif)', fontStyle: 'italic',
    fontVariationSettings: '"opsz" 14',
    fontSize: 10.5, color: 'var(--ink2)',
    letterSpacing: '0.01em',
    transition: 'opacity 700ms var(--ease-hermes)',
  },
  bulletDot: {
    width: 4, height: 4, borderRadius: 999,
    animation: 'status-fade 9s var(--ease-hermes) infinite',
  },
};

const STATUSES = [
  { dot: '#4A5D3A', text: 'atlas escutando · tarde · operador focado' },
  { dot: '#9B7A3F', text: 'atlas curando · próxima review 02:00' },

function LiveStatus({ initialIdx = 0 }) {
  const [idx, setIdx] = useState(initialIdx);
  const [visible, setVisible] = useState(true);
  useEffect(() => {
    const interval = setInterval(() => {
      setVisible(false);
      setTimeout(() => {
        setIdx(i => (i + 1) % STATUSES.length);
        setVisible(true);
      }, 700);
    }, 11000);
    return () => clearInterval(interval);
  }, []);
  const s = STATUSES[idx];
  return (
    <div style={liveStatusStyles.wrap}>
      <div style={{ ...liveStatusStyles.pill, opacity: visible ? 0.55 : 0 }}>
        <span style={{ ...liveStatusStyles.bulletDot, background: s.dot }} />
        <span>{s.text}</span>
      </div>
    </div>
  );
}
