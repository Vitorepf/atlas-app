<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas — Inbox v2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
:root {
  --bg:        #F4EFE6;
  --surface:   #EAE3D6;
  --premium:   #E0D8C9;
  --ink:       #1A1612;
  --ink2:      #6B6358;
  --ink3:      #A89F90;
  --border:    #D4CCBC;
  --bronze:    #9B7A3F;
  --bronze-deep: #7A5E2F;
  --prussian:  #1B3A57;
  --rec-red:   #8B2635;
  --moss:      #4A5D3A;
  --dom-blackink: #1B3A57;
  --dom-atlas:    #5D4A8A;
  --dom-saude:    #4A5D3A;
  --dom-financas: #9B7A3F;
  --dom-outro:    #6B6358;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:  'Inter', -apple-system, sans-serif;
  --mono:  'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  background: #15110d;
  font-family: var(--sans);
  color: rgba(244,239,230,0.85);
  min-height: 100vh;
}

@keyframes sync-sweep {
  0%, 100% { opacity: 0; transform: translateX(-100%); }
  50%      { opacity: 1; transform: translateX(0%); }
}
@keyframes capture-rest {
  0%, 100% { box-shadow: 0 8px 24px rgba(26,22,18,0.18); }
  50%      { box-shadow: 0 8px 24px rgba(26,22,18,0.18), 0 0 0 4px rgba(155,122,63,0.06); }
}

.stage {
  min-height: 100vh;
  padding: 56px 40px;
  display: flex;
  gap: 56px;
  justify-content: center;
  align-items: flex-start;
}

.frame-cap {
  font-family: var(--serif);
  font-style: italic;
  color: rgba(244,239,230,0.5);
  font-size: 13px;
  margin: 0 0 14px;
  text-align: center;
}

.notes {
  max-width: 380px;
  padding-top: 28px;
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.65;
  color: rgba(244,239,230,0.72);
}
.notes h2 {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.025em;
  color: #F4EFE6;
  margin: 0 0 4px;
}
.notes .lede {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  line-height: 1.55;
  color: rgba(244,239,230,0.92);
  margin: 8px 0 28px;
  border-left: 1px solid rgba(155,122,63,0.5);
  padding-left: 14px;
}
.notes h3 {
  font-family: var(--sans);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 10px;
  color: rgba(244,239,230,0.45);
  margin: 26px 0 10px;
  font-weight: 500;
}
.notes p { margin: 0 0 12px; }
.notes em {
  font-family: var(--serif);
  font-style: italic;
  color: rgba(244,239,230,0.95);
}
.notes ul { margin: 0; padding: 0; list-style: none; }
.notes li {
  padding: 7px 0;
  border-bottom: 1px solid rgba(244,239,230,0.06);
  display: flex; gap: 12px;
}
.notes li:last-child { border-bottom: none; }
.notes li .num {
  font-family: var(--mono);
  color: rgba(244,239,230,0.4);
  font-size: 11px;
  flex-shrink: 0;
  padding-top: 1px;
  min-width: 18px;
}
.notes .br { color: #C9A663; font-family: var(--serif); font-style: italic; }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

// ════════════════════════════════════════════════════════
//  IosFrame — huashu canonical
// ════════════════════════════════════════════════════════
const iosFrameStyles = {
  wrapper: {
    display: 'inline-block',
    padding: 12,
    background: '#000',
    borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.4)',
    position: 'relative',
  },
  screen: {
    position: 'relative',
    borderRadius: 48,
    overflow: 'hidden',
    background: '#F4EFE6',
  },
  statusBar: {
    position: 'absolute',
    top: 0, left: 0, right: 0,
    height: 54,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'space-between',
    padding: '0 32px',
    fontSize: 16,
    fontWeight: 600,
    fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20,
    pointerEvents: 'none',
  },
  dynamicIsland: {
    position: 'absolute',
    top: 12, left: '50%',
    transform: 'translateX(-50%)',
    width: 124, height: 36,
    background: '#000',
    borderRadius: 999,
    zIndex: 30,
  },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: {
    width: 26, height: 12,
    border: '1.5px solid currentColor',
    borderRadius: 3, padding: 1,
    position: 'relative', opacity: 0.85,
  },
  batteryCap: {
    position: 'absolute', top: 3, right: -3,
    width: 2, height: 6, background: 'currentColor',
    borderRadius: '0 1px 1px 0',
  },
  content: {
    position: 'absolute',
    top: 54, left: 0, right: 0, bottom: 34,
    overflow: 'auto',
  },
  homeIndicator: {
    position: 'absolute', bottom: 10,
    left: '50%', transform: 'translateX(-50%)',
    width: 140, height: 5,
    background: 'rgba(0,0,0,0.3)',
    borderRadius: 999, zIndex: 10,
  },
};
function IosFrame({ children, time = '12:39', battery = 81 }) {
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width: 393, height: 852 }}>
        <div style={{ ...iosFrameStyles.statusBar, color: '#1A1612' }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: '#1A1612' }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  Cartog — meridianos curvos + rosa dos ventos (P12)
// ════════════════════════════════════════════════════════
function Cartog() {
  return (
    <svg
      width="100%" height="100%"
      viewBox="0 0 393 800"
      preserveAspectRatio="xMidYMid slice"
      style={{ position: 'absolute', inset: 0, pointerEvents: 'none', opacity: 0.05, color: '#1A1612' }}
    >
      <path d="M 60 -20 Q 90 200 60 420 Q 30 640 60 860" stroke="currentColor" strokeWidth="0.5" fill="none" />
      <path d="M 333 -20 Q 303 200 333 420 Q 363 640 333 860" stroke="currentColor" strokeWidth="0.5" fill="none" />
      <path d="M 196 -20 Q 196 400 196 860" stroke="currentColor" strokeWidth="0.4" fill="none" opacity="0.6" />
      <path d="M -20 180 Q 196 200 410 180" stroke="currentColor" strokeWidth="0.4" fill="none" />
      <path d="M -20 460 Q 196 480 410 460" stroke="currentColor" strokeWidth="0.4" fill="none" />
      <path d="M -20 700 Q 196 720 410 700" stroke="currentColor" strokeWidth="0.4" fill="none" />
      <g transform="translate(345 30)" opacity="0.5">
        <circle r="11" fill="none" stroke="currentColor" strokeWidth="0.5" />
        <circle r="7"  fill="none" stroke="currentColor" strokeWidth="0.4" opacity="0.7" />
        <path d="M 0 -11 L 0 11 M -11 0 L 11 0" stroke="currentColor" strokeWidth="0.5" />
      </g>
      <circle cx="120" cy="320" r="0.8" fill="currentColor" opacity="0.7" />
      <circle cx="270" cy="240" r="0.8" fill="currentColor" opacity="0.7" />
      <circle cx="80"  cy="540" r="0.8" fill="currentColor" opacity="0.7" />
      <circle cx="290" cy="600" r="0.8" fill="currentColor" opacity="0.7" />
    </svg>
  );
}

// ════════════════════════════════════════════════════════
//  Header — title + meta line
// ════════════════════════════════════════════════════════
const headerStyles = {
  wrap: { padding: '20px 24px 6px', position: 'relative', zIndex: 1 },
  title: {
    fontFamily: 'var(--serif)',
    fontWeight: 400,
    fontSize: 42,
    lineHeight: '44px',
    letterSpacing: '-0.025em',
    color: 'var(--ink)',
    margin: 0,
  },
  meta: {
    display: 'flex',
    alignItems: 'baseline',
    gap: 8,
    marginTop: 8,
    fontFamily: 'var(--sans)',
    textTransform: 'uppercase',
    letterSpacing: '0.13em',
    fontSize: 11,
    fontWeight: 500,
    color: 'var(--ink2)',
  },
  metaSep: { color: 'var(--ink3)', opacity: 0.5 },
};

function Header({ openCount = 1, ageLabel = '9h', failedCount = 0 }) {
  return (
    <div style={headerStyles.wrap}>
      <h1 style={headerStyles.title}>Inbox</h1>
      <div style={headerStyles.meta}>
        <span>{openCount} aberta</span>
        <span style={headerStyles.metaSep}>·</span>
        <span>{ageLabel} idade média</span>
        {failedCount > 0 && (
          <>
            <span style={headerStyles.metaSep}>·</span>
            <span style={{ color: 'var(--rec-red)' }}>{failedCount} falha</span>
          </>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  Mode Tabs — Capturas / Operacional (sem caixa, underline ink)
// ════════════════════════════════════════════════════════
const modeStyles = {
  wrap: {
    display: 'flex',
    padding: '20px 24px 0',
    gap: 0,
    borderBottom: '0.5px solid var(--border)',
    position: 'relative',
    zIndex: 1,
  },
  tab: {
    paddingBottom: 14,
    paddingRight: 28,
    display: 'flex',
    flexDirection: 'column',
    gap: 2,
    cursor: 'pointer',
    position: 'relative',
  },
  tabHeader: {
    display: 'flex',
    alignItems: 'baseline',
    gap: 7,
  },
  tabLabel: {
    fontFamily: 'var(--serif)',
    fontWeight: 400,
    fontSize: 19,
    letterSpacing: '-0.01em',
    color: 'var(--ink2)',
  },
  tabLabelActive: {
    color: 'var(--ink)',
  },
  tabCount: {
    fontFamily: 'var(--mono)',
    fontWeight: 500,
    fontSize: 12,
    color: 'var(--ink3)',
    letterSpacing: '0.02em',
  },
  tabCountActive: { color: 'var(--ink)' },
  tabSubtitle: {
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 13,
    color: 'var(--ink3)',
  },
  tabSubtitleActive: { color: 'var(--ink2)' },
  underline: {
    position: 'absolute',
    bottom: -0.5,
    left: 0, right: 28,
    height: 1.5,
    background: 'var(--ink)',
  },
  tabCriticalDot: {
    width: 5, height: 5, borderRadius: 999,
    background: 'var(--rec-red)',
    marginLeft: 4,
  },
};

function ModeTab({ label, count, subtitle, active, critical }) {
  return (
    <div style={modeStyles.tab}>
      <div style={modeStyles.tabHeader}>
        <span style={{ ...modeStyles.tabLabel, ...(active ? modeStyles.tabLabelActive : {}) }}>{label}</span>
        <span style={{ ...modeStyles.tabCount, ...(active ? modeStyles.tabCountActive : {}) }}>{count}</span>
        {critical > 0 && <span style={modeStyles.tabCriticalDot} />}
      </div>
      <span style={{ ...modeStyles.tabSubtitle, ...(active ? modeStyles.tabSubtitleActive : {}) }}>
        {subtitle}
      </span>
      {active && <div style={modeStyles.underline} />}
    </div>
  );
}

function ModeTabs({ active = 'captures' }) {
  return (
    <div style={modeStyles.wrap}>
      <ModeTab
        label="Capturas"
        count="1"
        subtitle="1 aberta"
        active={active === 'captures'}
      />
      <ModeTab
        label="Operacional"
        count="0"
        subtitle="0 ativos"
        active={active === 'operational'}
      />
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  DomainChip + SearchPill + FilterStrip
// ════════════════════════════════════════════════════════
const filterStyles = {
  domainRow: {
    padding: '14px 24px 10px',
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 14,
    color: 'var(--ink2)',
    position: 'relative',
    zIndex: 1,
  },
  domainTrocar: { color: 'var(--ink3)', marginLeft: 6 },
  searchWrap: {
    margin: '0 24px 14px',
    position: 'relative',
    zIndex: 1,
  },
  searchPill: {
    background: 'var(--surface)',
    border: '0.5px solid var(--border)',
    borderRadius: 999,
    padding: '11px 18px',
    display: 'flex',
    alignItems: 'center',
    gap: 8,
  },
  searchInput: {
    flex: 1,
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 15,
    color: 'var(--ink2)',
    background: 'transparent',
    border: 0,
    outline: 'none',
  },
  searchSelect: {
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 13,
    color: 'var(--ink3)',
    cursor: 'pointer',
  },
  filterStrip: {
    padding: '0 24px 6px',
    display: 'flex',
    alignItems: 'baseline',
    gap: 22,
    overflowX: 'auto',
    overflowY: 'hidden',
    whiteSpace: 'nowrap',
    scrollbarWidth: 'none',
    position: 'relative',
    zIndex: 1,
  },
  chip: {
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 14.5,
    color: 'var(--ink3)',
    cursor: 'pointer',
    paddingBottom: 4,
    borderBottom: '1.5px solid transparent',
    transition: 'all 200ms',
    flexShrink: 0,
  },
  chipActive: {
    color: 'var(--ink)',
    borderBottomColor: 'var(--ink)',
  },
  sortLink: {
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 13,
    color: 'var(--ink3)',
    marginLeft: 'auto',
    flexShrink: 0,
    paddingBottom: 4,
    cursor: 'pointer',
    opacity: 0.85,
  },
};

function DomainChip() {
  return (
    <div style={filterStyles.domainRow}>
      em todos os domínios
      <span style={filterStyles.domainTrocar}>· trocar</span>
    </div>
  );
}

function SearchPill() {
  return (
    <div style={filterStyles.searchWrap}>
      <div style={filterStyles.searchPill}>
        <input
          style={filterStyles.searchInput}
          placeholder="buscar"
          readOnly
        />
        <span style={filterStyles.searchSelect}>· selecionar</span>
      </div>
    </div>
  );
}

const FILTERS = [
  { key: 'open', label: 'abertas' },
  { key: 'no_destination', label: 'sem destino' },
  { key: 'candidate', label: 'candidatas' },
  { key: 'proposal', label: 'propostas' },
  { key: 'snoozed', label: 'adiadas' },
  { key: 'failed', label: 'falhas' },
  { key: 'pending', label: 'pendentes' },
  { key: 'routed', label: 'com destino' },
];

function FilterStrip({ active = 'open' }) {
  return (
    <div style={filterStyles.filterStrip}>
      {FILTERS.map(f => (
        <span
          key={f.key}
          style={{ ...filterStyles.chip, ...(active === f.key ? filterStyles.chipActive : {}) }}
        >
          {f.label}
        </span>
      ))}
      <span style={filterStyles.sortLink}>· por recente</span>
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  Date divider
// ════════════════════════════════════════════════════════
const dividerStyles = {
  wrap: {
    display: 'flex',
    alignItems: 'center',
    gap: 14,
    padding: '24px 24px 8px',
    position: 'relative',
    zIndex: 1,
  },
  label: {
    fontFamily: 'var(--sans)',
    textTransform: 'uppercase',
    letterSpacing: '0.16em',
    fontSize: 10,
    fontWeight: 500,
    color: 'var(--ink3)',
  },
  line: {
    flex: 1,
    height: 1,
    background: 'var(--border)',
    opacity: 0.55,
  },
};

function DateDivider({ label }) {
  return (
    <div style={dividerStyles.wrap}>
      <span style={dividerStyles.label}>{label}</span>
      <span style={dividerStyles.line} />
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  Inbox Card — meta + body + nextStepLabel + 5 actions
// ════════════════════════════════════════════════════════
const cardStyles = {
  card: {
    padding: '12px 24px 18px',
    borderBottom: '0.5px solid var(--border)',
    position: 'relative',
  },
  cardLast: { borderBottom: 'none' },
  meta: {
    display: 'flex',
    alignItems: 'center',
    gap: 10,
    marginBottom: 12,
  },
  time: {
    fontFamily: 'var(--mono)',
    fontWeight: 500,
    fontSize: 12,
    letterSpacing: '0.02em',
    color: 'var(--ink2)',
  },
  sep: { color: 'var(--ink3)', opacity: 0.45, fontSize: 11 },
  kind: {
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 13,
    color: 'var(--ink2)',
  },
  domainBullet: {
    width: 6, height: 6, borderRadius: 999,
    display: 'inline-block',
    marginRight: 7,
  },
  domainName: {
    fontFamily: 'var(--sans)',
    fontWeight: 500,
    textTransform: 'uppercase',
    letterSpacing: '0.13em',
    fontSize: 10,
  },
  privateTag: {
    marginLeft: 'auto',
    fontFamily: 'var(--sans)',
    fontWeight: 500,
    textTransform: 'uppercase',
    letterSpacing: '0.16em',
    fontSize: 9.5,
    color: 'var(--ink3)',
    opacity: 0.85,
  },
  body: {
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontWeight: 400,
    fontSize: 17.5,
    lineHeight: '27px',
    color: 'var(--ink)',
    margin: 0,
    letterSpacing: '-0.005em',
    textWrap: 'pretty',
  },
  nextStep: {
    marginTop: 12,
    display: 'flex',
    alignItems: 'baseline',
    gap: 7,
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 13,
    color: 'var(--prussian)',
    opacity: 0.92,
  },
  bronzeStar: {
    color: 'var(--bronze)',
    fontSize: 13,
    lineHeight: 1,
  },
  actionRow: {
    marginTop: 16,
    display: 'flex',
    alignItems: 'stretch',
    gap: 0,
    paddingTop: 14,
    borderTop: '0.5px solid var(--border)',
  },
  action: {
    flex: 1,
    fontFamily: 'var(--serif)',
    fontStyle: 'italic',
    fontSize: 14,
    color: 'var(--ink2)',
    textAlign: 'center',
    cursor: 'pointer',
    padding: '2px 0',
    borderRight: '0.5px solid var(--border)',
  },
  actionLast: { borderRight: 'none' },
  actionDanger: { color: 'var(--rec-red)', opacity: 0.72 },
};

function InboxCard({
  time, kind, domainKey, domainLabel,
  text, isPrivate, isCandidate,
  nextStepLabel, isLast,
}) {
  const domainColors = {
    blackink: 'var(--dom-blackink)',
    atlas: 'var(--dom-atlas)',
    saude: 'var(--dom-saude)',
    financas: 'var(--dom-financas)',
    outro: 'var(--dom-outro)',
  };
  const dColor = domainColors[domainKey] || 'var(--ink3)';
  return (
    <div style={{ ...cardStyles.card, ...(isLast ? cardStyles.cardLast : {}) }}>
      <div style={cardStyles.meta}>
        <span style={cardStyles.time}>{time}</span>
        <span style={cardStyles.sep}>·</span>
        <span style={cardStyles.kind}>{kind}</span>
        <span style={cardStyles.sep}>·</span>
        <span style={{ ...cardStyles.domainBullet, background: dColor }} />
        <span style={{ ...cardStyles.domainName, color: dColor }}>{domainLabel}</span>
        {isPrivate && <span style={cardStyles.privateTag}>privado</span>}
      </div>
      <p style={cardStyles.body}>«{text}»</p>
      {nextStepLabel && (
        <div style={cardStyles.nextStep}>
          {isCandidate && <span style={cardStyles.bronzeStar}>✦</span>}
          <span>{nextStepLabel}</span>
        </div>
      )}
      <div style={cardStyles.actionRow}>
        <span style={cardStyles.action}>promover</span>
        <span style={cardStyles.action}>tarefa</span>
        <span style={cardStyles.action}>projeto</span>
        <span style={cardStyles.action}>adiar</span>
